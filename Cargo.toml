[package]
name = "den-subtitles"
version = "0.6.3"
edition = "2021"
description = "Den subtitles, one container: Stremio subtitles addon that fetches (OpenSubtitles, hash-matched), AI-translates (BYOK), and auto-syncs (alass/ffsubsync) SRTs for the Den Apple TV app"
publish = false
license = "MIT"

[[bin]]
name = "den-subtitles"
path = "src/main.rs"

[dependencies]
# current_thread async runtime — this is an I/O-bound proxy; the CPU work lives in the
# alass/ffsubsync/ffmpeg subprocesses and the LLM APIs, not here. Keeps homelab idle RAM minimal.
tokio = { version = "1", features = ["rt", "macros", "net", "process", "fs", "io-util", "time", "sync", "signal"] }
hyper = { version = "1", features = ["server", "http1"] }
# server-graceful: stop accepting on SIGTERM and let in-flight requests finish (see serve_until).
hyper-util = { version = "0.1", features = ["tokio", "http1", "server-graceful"] }
http-body-util = "0.1"
bytes = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# rustls (not OpenSSL) with bundled webpki roots → no ca-certificates juggling, static-friendly TLS.
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream"] }
tokio-util = { version = "0.7", features = ["io"] }
futures-util = { version = "0.3", default-features = false, features = ["std", "async-await"] }
base64 = "0.23"
# Sealed config-in-URL (docs mirror of den-scout/docs/SEALED-CONFIG.md): decrypt a config sealed to
# the addon's X25519 key. `seal` = libsodium crypto_box_seal (X25519 + XSalsa20-Poly1305, blake2b nonce),
# byte-compatible with the Go addon + the browser bundle. Decrypt-only here → no rng needed.
crypto_box = { version = "0.9", features = ["seal"] }
# Constant-time comparison of the /metrics bearer token. Already in the tree under crypto_box.
subtle = "2"
# Subtitle files are whatever encoding the uploader's editor saved (Windows-1250/1251, ISO-8859-x,
# UTF-16), and the player downstream drops any cue that is not UTF-8. chardetng guesses the legacy
# encoding the way Firefox does for unlabeled pages; encoding_rs decodes it.
chardetng = "1"
encoding_rs = "0.8"

[dev-dependencies]
tokio = { version = "1", features = ["rt", "macros", "net", "process", "fs", "io-util", "time", "sync", "signal", "test-util"] }

# Self-contained binary for a resource-constrained homelab. panic=unwind (default): a panic in one
# request task unwinds just that connection (tokio catches it) instead of aborting the whole server.
[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
