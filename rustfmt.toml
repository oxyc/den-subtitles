# The same settings as den-atlas, so every Rust addon formats alike. They are close to how this code
# was already written: rustfmt's defaults (width 100, short-item heuristics) rewrap far more of it.
edition = "2021"
max_width = 110

# Keep short structs, calls and matches on one line instead of exploding them one field per line.
use_small_heuristics = "Max"
