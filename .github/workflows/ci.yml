name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  # docker-publish.yml calls this as its gate, so a tag cannot publish an image CI would reject.
  workflow_call:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Formatting
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Tests
        run: cargo test --locked

  tier1-corpus:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          target: corpus
          load: true
          tags: den-subtitles-tier1-corpus:ci
          cache-from: type=gha,scope=tier1-corpus
          cache-to: type=gha,mode=max,scope=tier1-corpus
      - name: Tier-1 parity and resource gate
        run: >-
          docker run --rm
          --memory=512m --memory-swap=512m
          den-subtitles-tier1-corpus:ci --cgroup-memory-gate

  # The image carries the sync toolchain (alass and ffmpeg) on top of the binary, so it builds
  # differently from `cargo build`. Catching a Dockerfile break on the PR rather than at `git tag`
  # time, without pushing, for amd64 — the only arch the box runs. A tag's publish job builds it anyway.
  build-pr:
    needs: [test, tier1-corpus]
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          platforms: linux/amd64
          cache-from: type=gha
          cache-to: type=gha,mode=max
