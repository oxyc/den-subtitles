# Build the den-subtitles image and push it to GitHub Container Registry, on a v* tag (a deliberate
# release) or a manual run — NOT every main push. The box updates only when you cut a tag. No app release.
name: docker-publish

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/den-subtitles

jobs:
  # The whole of ci.yml, against the tagged commit: a tag cannot publish an image CI would reject.
  ci:
    uses: ./.github/workflows/ci.yml

  build:
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      # The manifest reads env!("CARGO_PKG_VERSION") and the image tag is the git tag — so a v* release
      # must equal v<Cargo.toml version> or the reported version would be a lie. Fail fast on a mismatch.
      - name: Tag matches Cargo.toml version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          cargo_v=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          echo "Cargo.toml=$cargo_v  tag=$GITHUB_REF_NAME"
          test "v$cargo_v" = "$GITHUB_REF_NAME" || { echo "::error::tag $GITHUB_REF_NAME != Cargo.toml v$cargo_v — bump Cargo.toml before tagging"; exit 1; }

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive tags
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          # a v1.2.3 tag → :1.2.3, :1.2, :1, :latest (+ :sha). Publish runs on tags only, so :latest
          # is unconditional — the newest release is what the box's :latest pull gets.
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha
            type=raw,value=latest

      - uses: docker/setup-buildx-action@v4

      # amd64 only: it is the one arch the box runs.
      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
